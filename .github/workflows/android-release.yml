name: Signed Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases and their tags are created/removed by the built-in GitHub token.
permissions:
  contents: write

jobs:
  signed-android-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package is obsolete and fails SDK setup.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build production web assets
        run: npm run build

      - name: Copy web assets and sync Capacitor plugins
        run: npx cap sync android

      - name: Restore configured APK signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Prefer permanent production signing whenever its four secrets exist.
          # The single debug-key secret is supported as a DEVELOPMENT fallback.
          if [[ -n "$RELEASE_KEYSTORE_BASE64" ]]; then
            if [[ -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::Production keystore is configured but its password or alias secrets are missing."
              exit 1
            fi
            if [[ "$RELEASE_KEY_ALIAS" == "androiddebugkey" ]]; then
              echo "::error::Production signing must not use the Android debug-key alias."
              exit 1
            fi
            KEYSTORE_BASE64="$RELEASE_KEYSTORE_BASE64"
            KEYSTORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            SIGNING_KIND="production"
          elif [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            # Standard Android debug key: androiddebugkey / android.
            # The build variant is release, but the certificate is DEBUG.
            KEYSTORE_BASE64="$DEBUG_KEYSTORE_BASE64"
            KEYSTORE_PASSWORD="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASSWORD="android"
            SIGNING_KIND="debug"
            echo "::warning::Release-variant APK signed with the existing Android DEBUG key. Not production-signed."
          else
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 with production credentials, or ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/SpaceImpactDefender-signing.jks"
          export KEYSTORE_BASE64 KEYSTORE_PATH
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          # Normalize pasted formatting without logging private key material.
          encoded = os.environ["KEYSTORE_BASE64"].strip().lstrip("\ufeff")
          for prefix in ("ANDROID_DEBUG_KEYSTORE_BASE64=", "ANDROID_KEYSTORE_BASE64="):
              if encoded.startswith(prefix):
                  encoded = encoded[len(prefix):]
          encoded = encoded.strip().strip("'\"")
          if encoded.startswith("data:") and "base64," in encoded:
              encoded = encoded.split("base64,", 1)[1]
          encoded = encoded.replace("\\n", "").replace("\\r", "")
          encoded = re.sub(r"\s+", "", encoded).rstrip("%")
          encoded = encoded.replace("-", "+").replace("_", "/")
          encoded += "=" * (-len(encoded) % 4)
          try:
              contents = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error):
              print("::error::Android keystore secret is not valid base64. Re-encode the binary keystore and replace the secret value.")
              sys.exit(1)
          if len(contents) < 100:
              print("::error::Decoded Android keystore is empty or too small. Re-encode the .jks file.")
              sys.exit(1)
          with open(os.environ["KEYSTORE_PATH"], "wb") as keystore:
              keystore.write(contents)
          print("Decoded keystore data; validating alias and certificate.")
          PY
          chmod 600 "$KEYSTORE_PATH"

          if ! ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" keytool -list \
              -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Signing keystore cannot be opened. Check the debug secret or supply production credentials."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KIND=$SIGNING_KIND" >> "$GITHUB_ENV"

      - name: Restore cached Gradle 8.14.3 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/space-impact-gradle/8.14.3
          key: gradle-8.14.3-jdk21-${{ runner.os }}-v1

      - name: Prepare compatible pinned Gradle
        run: bash scripts/setup-pinned-gradle.sh

      - name: Build release-signed APK (not debug)
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: "$SPACE_IMPACT_GRADLE --no-daemon --stacktrace assembleRelease"

      - name: Verify APK certificate matches selected signing keystore
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/SpaceImpactDefender-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

          # Verify the APK uses the exact selected certificate, whether the
          # temporary development fallback or the permanent production key.
          EXPECTED_CERT="$(
            keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD |
              awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          ACTUAL_CERT="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" |
              awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}'
          )"
          if [[ -z "$EXPECTED_CERT" || "$EXPECTED_CERT" != "$ACTUAL_CERT" ]]; then
            echo "::error::Release APK signing certificate differs from selected keystore."
            exit 1
          fi

          mkdir -p release-output
          cp "$APK" "release-output/SpaceImpactDefender-v${GITHUB_RUN_NUMBER}-release.apk"

      - name: Publish one APK per release with explicit signing status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${GITHUB_RUN_NUMBER}"
          APK="release-output/SpaceImpactDefender-v${GITHUB_RUN_NUMBER}-release.apk"
          if [[ "$ANDROID_SIGNING_KIND" == "debug" ]]; then
            RELEASE_NOTES="Release-variant APK from commit ${GITHUB_SHA}. WARNING: Signed with an Android DEBUG keystore, NOT a production certificate. For development and testing only. Future updates require this same signing key."
          else
            RELEASE_NOTES="Production-signed release APK from commit ${GITHUB_SHA}. Future updates use the same permanent production certificate."
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Space Impact Defenders Android 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Retain only the latest three APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Manage only releases created by this Android workflow.
          # Other project releases (e.g. desktop) are intentionally untouched.
          mapfile -t old_tags < <(
            gh release list --limit 1000 --json tagName,isDraft,publishedAt |
            jq -r '[.[] | select(.isDraft == false and (.tagName | test("^android-v[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName'
          )
          for tag in "${old_tags[@]}"; do
            echo "Removing old APK release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
