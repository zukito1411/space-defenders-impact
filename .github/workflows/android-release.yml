name: Signed Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases and their tags are created/removed by the built-in GitHub token.
permissions:
  contents: write

jobs:
  signed-android-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build production web assets
        run: npm run build

      - name: Copy web assets and sync Capacitor plugins
        run: npx cap sync android

      - name: Restore the persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          if [[ "$ANDROID_KEY_ALIAS" == "androiddebugkey" ]]; then
            echo "::error::A production release key is required; do not use the Android debug key."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/SpaceImpactDefender-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release-signed APK (not debug)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature and prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/SpaceImpactDefender-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release-output
          cp "$APK" "release-output/SpaceImpactDefender-v${GITHUB_RUN_NUMBER}-release.apk"

      - name: Publish exactly one signed APK per release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${GITHUB_RUN_NUMBER}"
          APK="release-output/SpaceImpactDefender-v${GITHUB_RUN_NUMBER}-release.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Space Impact Defenders Android 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "Release-signed Android APK from main commit ${GITHUB_SHA}. Install this APK to play. Every future release uses the same production signing key." \
              --latest
          fi

      - name: Retain only the latest three APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Manage only releases created by this Android workflow.
          # Other project releases (e.g. desktop) are intentionally untouched.
          mapfile -t old_tags < <(
            gh release list --limit 1000 --json tagName,isDraft,publishedAt |
            jq -r '[.[] | select(.isDraft == false and (.tagName | test("^android-v[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName'
          )
          for tag in "${old_tags[@]}"; do
            echo "Removing old APK release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
