name: Signed Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases and their tags are created/removed by the built-in GitHub token.
permissions:
  contents: write

# Never race two pushes while initializing the permanent signing key.
concurrency:
  group: space-impact-android-signed-main
  cancel-in-progress: false

jobs:
  signed-android-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package is obsolete and fails SDK setup.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build production web assets
        run: npm run build

      - name: Copy web assets and sync Capacitor plugins
        run: npx cap sync android

      - name: Restore persistent Android signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Draft GitHub releases are visible only to collaborators with
          # write access. NEVER publish this release or its signing key.
          VAULT_TAG="space-impact-private-signing-vault-v1"
          VAULT_ASSET="SpaceImpactDefender-private-signing-vault-v1.tar.gz"
          VAULT_DIR="$RUNNER_TEMP/space-impact-signing-vault"
          VAULT_ARCHIVE="$RUNNER_TEMP/$VAULT_ASSET"
          KEYSTORE_PATH="$VAULT_DIR/SpaceImpactDefender-release.jks"
          mkdir -p "$VAULT_DIR"
          if gh release view "$VAULT_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/vault-is-draft" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/vault-is-draft")" != "true" ]]; then
              echo "::error::The private signing vault was published! Stop and secure the key."
              exit 1
            fi
            echo "Restoring permanent signing key from existing private draft."
            gh release download "$VAULT_TAG" --pattern "$VAULT_ASSET" --dir "$RUNNER_TEMP" --clobber
            test -s "$VAULT_ARCHIVE"
            tar -xzf "$VAULT_ARCHIVE" -C "$VAULT_DIR"
          else
            echo "Creating the first permanent Android signing key."
            if [[ -n "$RELEASE_KEYSTORE_BASE64" ]]; then
              if [[ -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
                echo "::error::Optional permanent signing secrets are incomplete."
                exit 1
              fi
              printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
              STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
              KEY_ALIAS="$RELEASE_KEY_ALIAS"
              KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            else
              # Ignore ANDROID_DEBUG_KEYSTORE_BASE64, which previously held
              # a fingerprint and cannot sign or update an Android APK.
              STORE_PASSWORD="$(openssl rand -hex 32)"
              KEY_ALIAS="spaceimpactdefender"
              KEY_PASSWORD="$STORE_PASSWORD"
              echo "::add-mask::$STORE_PASSWORD"
              keytool -genkeypair -noprompt -storetype PKCS12 \
                -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
                -keyalg RSA -keysize 3072 -validity 10000 \
                -dname "CN=Space Impact Defender, O=Space Impact Defenders" \
                -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD"
            fi
            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            printf '%s' "$STORE_PASSWORD" > "$VAULT_DIR/store-password"
            printf '%s' "$KEY_ALIAS" > "$VAULT_DIR/key-alias"
            printf '%s' "$KEY_PASSWORD" > "$VAULT_DIR/key-password"
            chmod 600 "$KEYSTORE_PATH"
            tar -czf "$VAULT_ARCHIVE" -C "$VAULT_DIR" \
              SpaceImpactDefender-release.jks store-password key-alias key-password
            gh release create "$VAULT_TAG" "$VAULT_ARCHIVE" \
              --target "$GITHUB_SHA" --draft \
              --title "PRIVATE ANDROID SIGNING VAULT - DO NOT PUBLISH" \
              --notes "CONTAINS PRIVATE SIGNING KEY AND PASSWORD. NEVER PUBLISH, SHARE OR DELETE."
            if [[ "$(gh release view "$VAULT_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "::error::Unable to confirm private signing vault."
              exit 1
            fi
            echo "Permanent certificate saved for all subsequent builds."
          fi
          for item in SpaceImpactDefender-release.jks store-password key-alias key-password; do
            test -s "$VAULT_DIR/$item" || { echo "::error::Corrupt signing vault: missing $item"; exit 1; }
          done
          STORE_PASSWORD="$(cat "$VAULT_DIR/store-password")"
          KEY_ALIAS="$(cat "$VAULT_DIR/key-alias")"
          KEY_PASSWORD="$(cat "$VAULT_DIR/key-password")"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          chmod 600 "$KEYSTORE_PATH"
          if ! ANDROID_KEYSTORE_PASSWORD="$STORE_PASSWORD" keytool -list \
              -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Saved signing key is invalid. Never silently rotate a key."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KIND=permanent" >> "$GITHUB_ENV"

      - name: Restore cached Gradle 8.14.3 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/space-impact-gradle/8.14.3
          key: gradle-8.14.3-jdk21-${{ runner.os }}-v1

      - name: Prepare compatible pinned Gradle
        run: bash scripts/setup-pinned-gradle.sh

      - name: Build release-signed APK (not debug)
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: "$SPACE_IMPACT_GRADLE --no-daemon --stacktrace assembleRelease"

      - name: Verify APK certificate matches selected signing keystore
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/SpaceImpactDefender-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

          # Verify the APK uses the exact selected certificate, whether the
          # temporary development fallback or the permanent production key.
          EXPECTED_CERT="$(
            keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD |
              awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          ACTUAL_CERT="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" |
              awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}'
          )"
          if [[ -z "$EXPECTED_CERT" || "$EXPECTED_CERT" != "$ACTUAL_CERT" ]]; then
            echo "::error::Release APK signing certificate differs from selected keystore."
            exit 1
          fi

          mkdir -p release-output
          cp "$APK" "release-output/SpaceImpactDefender-v${GITHUB_RUN_NUMBER}-release.apk"

      - name: Publish one APK per release with explicit signing status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${GITHUB_RUN_NUMBER}"
          APK="release-output/SpaceImpactDefender-v${GITHUB_RUN_NUMBER}-release.apk"
          RELEASE_NOTES="Android APK from commit ${GITHUB_SHA}. Signed with the same permanent certificate secured in an unpublished private draft. v19 and earlier had per-build keys and require one last reinstall."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Space Impact Defenders Android 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Retain only the latest three APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Manage only releases created by this Android workflow.
          # Other project releases (e.g. desktop) are intentionally untouched.
          mapfile -t old_tags < <(
            gh release list --limit 1000 --json tagName,isDraft,publishedAt |
            jq -r '[.[] | select(.isDraft == false and (.tagName | test("^android-v[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName'
          )
          for tag in "${old_tags[@]}"; do
            echo "Removing old APK release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
